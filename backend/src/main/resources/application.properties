spring.application.name=disponibiliteEtablissementSercives

# PostgreSQL
# Valeurs par défaut pour un lancement local (hors Docker).
# Dans Docker, le docker-compose les remplace via SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:postgresql://localhost:5432/gestionEtablissement
spring.datasource.username=${DB_USER:yann}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT : valeurs lues depuis l'environnement, sans valeur par défaut
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}